name: Full-stack auth smoke

# Boots the *published* full stack (ghcr.io/.../:<tag> images, not a build
# from source — this repo has no checkout of sockbowl-game/questions/ng to
# build from) with AUTH_ENABLED=true under the dev/e2e overlay, and runs
# scripts/smoke-auth.sh (which delegates the STOMP rows to
# scripts/stomp-probe.mjs): the plan's section 4.1 REST/GraphQL/STOMP
# authorization matrix, for real, against real Keycloak tokens.
#
# Manual only (workflow_dispatch), not on every push/PR: unlike
# rbac-reconcile.yml's Keycloak+Postgres-only stack, this brings up the whole
# --profile full stack (network_mode: host: kafka, postgres, redis, neo4j,
# keycloak, game, questions, ng) plus a local Ollama for questions' embedding
# model — several minutes end to end. It defaults to whatever is published at
# :main, but each of game/questions/ng's image tag can be overridden per run
# (the workflow_dispatch inputs below), so once a release has actually pushed
# images this can target that specific tag instead of only :main; it still
# never builds this PR's unpushed source (see docker-compose.build.yml's
# header comment for running against local builds instead, e.g. from an
# orchestration workflow that has checked out the sibling repos). Run it by
# hand after pushing images, or wire a `workflow_call` from a cross-repo
# release workflow once one exists.
#
# See docs/auth.md "Single full-stack constraint" / scripts/test-compose-posture.sh:
# this stack uses network_mode: host throughout, so it cannot run next to
# another full stack on the same runner. GitHub-hosted runners are
# single-job-per-VM, so this is never actually a conflict in CI; it only
# matters when running this by hand on a shared dev host (serialize with any
# other full/keycloak+postgres stack there).

on:
  workflow_dispatch:
    inputs:
      game_tag:
        description: "sockbowl-game image tag (ghcr.io/jacob-sabella/sockbowl-game:<tag>)"
        required: false
        default: "main"
        type: string
      questions_tag:
        description: "sockbowl-questions image tag (ghcr.io/jacob-sabella/sockbowl-questions:<tag>)"
        required: false
        default: "main"
        type: string
      ng_tag:
        description: "sockbowl-ng image tag (ghcr.io/jacob-sabella/sockbowl-ng:<tag>)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke-auth.sh against the published stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Syntax-check the scripts
        run: |
          bash -n scripts/smoke-auth.sh
          bash -n scripts/lib/kafka-consumer-stability.sh
          node --check scripts/stomp-probe.mjs

      - name: Unit-test the Kafka readiness fallback parsing (FIX-D1)
        run: scripts/test-kafka-readiness.sh

      - name: Install stomp-probe.mjs runtime deps
        run: npm install
        working-directory: scripts

      - name: Install Ollama and pull the embedding model
        # questions' Neo4j vector store always embeds via Ollama at startup
        # (see .env.example), regardless of the chat provider; without this
        # the vector store init 404s and sockbowl-questions never reports
        # healthy.
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl enable --now ollama
          for _ in $(seq 1 30); do curl -fsS http://localhost:11434/ >/dev/null 2>&1 && break; sleep 2; done
          ollama pull mxbai-embed-large

      - name: Generate real secrets and bring up the full stack
        env:
          COMPOSE_PROJECT: sbm2-smoke-ci
          SOCKBOWL_GAME_IMAGE: "ghcr.io/jacob-sabella/sockbowl-game:${{ inputs.game_tag }}"
          SOCKBOWL_QUESTIONS_IMAGE: "ghcr.io/jacob-sabella/sockbowl-questions:${{ inputs.questions_tag }}"
          SOCKBOWL_NG_IMAGE: "ghcr.io/jacob-sabella/sockbowl-ng:${{ inputs.ng_tag }}"
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "NEO4J_PASSWORD=$(openssl rand -hex 24)"
            echo "KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "KEYCLOAK_USER_PASSWORD=$(openssl rand -hex 24)"
            echo "SOCKBOWL_GAME_BACKEND_SECRET=$(openssl rand -hex 24)"
          } >> .env
          docker compose -p "$COMPOSE_PROJECT" --env-file .env \
            -f docker-compose.yml -f docker-compose.dev.yml \
            --profile full up -d
          # tail -n1: .env.example already has placeholder lines for both of
          # these, and this appends real ones below them. docker compose's
          # own --env-file parsing takes the last match for a duplicate key
          # (confirmed: `docker compose config` resolves to the appended
          # value), but a plain grep returns both lines, silently corrupting
          # the var with an embedded newline; tail -n1 picks the same one
          # compose uses.
          echo "SOCKBOWL_GAME_BACKEND_SECRET=$(grep '^SOCKBOWL_GAME_BACKEND_SECRET=' .env | tail -n1 | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "NEO4J_PASSWORD=$(grep '^NEO4J_PASSWORD=' .env | tail -n1 | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: Wait for the stack to become healthy
        env:
          COMPOSE_PROJECT: sbm2-smoke-ci
        run: |
          compose() { docker compose -p "$COMPOSE_PROJECT" --env-file .env -f docker-compose.yml -f docker-compose.dev.yml "$@"; }
          for svc in keycloak sockbowl-game sockbowl-questions sockbowl-ng; do
            health=""
            for _ in $(seq 1 90); do
              health="$(compose ps -a --format '{{.Health}}' "$svc" 2>/dev/null || true)"
              echo "state: $svc -> $health"
              [ "$health" = "healthy" ] && break
              sleep 10
            done
            if [ "$health" != "healthy" ]; then
              echo "::error::$svc never became healthy"
              compose logs "$svc" || true
              exit 1
            fi
          done

      - name: Run scripts/smoke-auth.sh
        run: scripts/smoke-auth.sh

      - name: Tear down (always, including volumes)
        if: always()
        env:
          COMPOSE_PROJECT: sbm2-smoke-ci
        run: |
          docker compose -p "$COMPOSE_PROJECT" --env-file .env \
            -f docker-compose.yml -f docker-compose.dev.yml \
            --profile full down -v --remove-orphans || true
