# Dev / e2e overlay (D9).
#
# docker-compose.yml alone is production-capable by default: Keycloak runs
# `start` with strict hostname checking, demo accounts are off, and there is
# no direct-grant client. That's wrong for local iteration and for Playwright,
# which need a fast Keycloak (`start-dev`), seeded demo logins, and a
# password-grant client (`sockbowl-e2e`) so tests can get tokens without
# driving the browser through the Keycloak login UI every time.
#
# Usage (see README.md "Authentication modes"):
#   docker compose -p sockbowl-e2e -f docker-compose.yml -f docker-compose.dev.yml \
#     [-f docker-compose.build.yml] --profile full up -d
#
# Never use this overlay for a real deployment: ALLOW_INSECURE_DEFAULTS=true
# disables the placeholder-secret refusal in scripts/check-secrets.sh.
#
# M4 (rate limiting / quotas, docs/limits.md "Compose overlays"): every
# Playwright worker and the bot harness share one IP, and M2's
# and M3's e2e suites (plus normal local dev) must not get throttled by M4's
# production-sized limits. This overlay therefore relaxes the *rate* policies
# game and questions actually key by IP or by one shared local user, and
# raises the guest/player/author hosted-sessions *quotas* enough that no
# suite trips them. It deliberately leaves `session-create`'s rate at a
# moderate value rather than raising it as high as the others (kept in case
# a future spec test wants to observe it); M4's own Playwright specs use tiny
# limits from docker-compose.limits-e2e.yml, layered on top of this file, not
# by lowering anything here.
#
# M7 (plans/m7-deploy.md §3.2, DK-3): the base file's sockbowl-game client
# allows only ${SOCKBOWL_PUBLIC_URL}; this overlay adds the dev origins (the
# `ng serve` port 4200 and the game port) through
# SOCKBOWL_EXTRA_REDIRECT_ORIGINS, which reproduces the pre-M7 dev redirect
# set. It also supplies a dev-only Redis password (check-secrets.sh refuses the
# sockbowl-dev-* value outside ALLOW_INSECURE_DEFAULTS=true) to redis, game and
# questions alike. Set SOCKBOWL_REDIS_PASSWORD= (explicitly empty) to run
# Redis without auth for app images that predate SOCKBOWL_REDIS_PASSWORD.
services:
  redis:
    environment:
      - ALLOW_INSECURE_DEFAULTS=true
      - SOCKBOWL_REDIS_PASSWORD=${SOCKBOWL_REDIS_PASSWORD-sockbowl-dev-redis-password}
      - REDISCLI_AUTH=${SOCKBOWL_REDIS_PASSWORD-sockbowl-dev-redis-password}

  keycloak:
    command: start-dev --import-realm
    environment:
      - KC_HOSTNAME_STRICT=false

  keycloak-realm-init:
    environment:
      - ALLOW_INSECURE_DEFAULTS=true

  rbac-init:
    environment:
      - ALLOW_INSECURE_DEFAULTS=true
      - CREATE_DEMO_ACCOUNTS=true
      - DEMO_PASSWORD=${DEMO_PASSWORD:-demo123}
      - SOCKBOWL_E2E=true
      - KC_ACCESS_TOKEN_LIFESPAN=${KC_ACCESS_TOKEN_LIFESPAN:-300}
      - SOCKBOWL_EXTRA_REDIRECT_ORIGINS=${SOCKBOWL_EXTRA_REDIRECT_ORIGINS:-${APP_PROTOCOL}://${APP_HOST}:4200 ${APP_PROTOCOL}://${APP_HOST}:${SOCKBOWL_GAME_PORT}}

  sockbowl-game:
    environment:
      SOCKBOWL_REDIS_PASSWORD: "${SOCKBOWL_REDIS_PASSWORD-sockbowl-dev-redis-password}"
      SOCKBOWL_RL_DEFAULT_CAPACITY: "10000"
      SOCKBOWL_RL_SESSION_CREATE_CAPACITY: "1000"
      SOCKBOWL_RL_SESSION_JOIN_CAPACITY: "1000"
      SOCKBOWL_RL_WS_CONNECT_CAPACITY: "1000"
      SOCKBOWL_RL_STOMP_SEND_IP_CAPACITY: "10000"
      SOCKBOWL_QUOTA_GUEST_HOSTED_SESSIONS: "100"
      SOCKBOWL_QUOTA_PLAYER_HOSTED_SESSIONS: "100"
      SOCKBOWL_QUOTA_AUTHOR_HOSTED_SESSIONS: "100"

  sockbowl-questions:
    environment:
      SOCKBOWL_REDIS_PASSWORD: "${SOCKBOWL_REDIS_PASSWORD-sockbowl-dev-redis-password}"
      SOCKBOWL_RL_DEFAULT_CAPACITY: "10000"
      SOCKBOWL_RL_GRAPHQL_WRITE_CAPACITY: "1000"
      SOCKBOWL_RL_GRAPHQL_READ_CAPACITY: "5000"
