# Local-image overlay.
#
# The "full" profile defaults to the published GHCR `:main` images. Layer this
# file on top of docker-compose.yml (plus docker-compose.dev.yml for e2e) to
# run against locally built code instead, e.g. for the full-stack smoke test
# and Playwright e2e (see scripts/clean-clone-test.sh and docs/auth.md).
#
#   docker compose -p sockbowl-e2e -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.build.yml --profile full up -d --build
#
# sockbowl-ng ships a real Dockerfile, so Compose can build it directly here.
# sockbowl-game and sockbowl-questions are Spring Boot apps built as OCI
# images by Cloud Native Buildpacks (`./gradlew bootBuildImage`), which have
# no Dockerfile for Compose's `build:` to point at. Build those two the same
# way CI does, then tag the result for this overlay to pick up:
#
#   (cd ../sockbowl-game && GITHUB_REPOSITORY=sockbowl/sockbowl-game ./gradlew bootBuildImage \
#     -I <mavenlocal-init>.gradle -PsockbowlUseMavenLocal=true)
#   docker tag "$(docker images -q ghcr.io/*/sockbowl-game* | head -1)" sockbowl-game:local
#
#   (cd ../sockbowl-questions && GITHUB_REPOSITORY=sockbowl/sockbowl-questions ./gradlew bootBuildImage)
#   docker tag "$(docker images -q ghcr.io/*/sockbowl-questions* | head -1)" sockbowl-questions:local
#
# bootBuildImage's imageName defaults to ghcr.io/${GITHUB_REPOSITORY}:${version}.
# GITHUB_REPOSITORY is normally set by GitHub Actions (to the real
# "owner/repo"); running the same gradlew command by hand, e.g. against
# these two local worktrees, leaves it unset, and the build.gradle fallback
# is the literal string "OWNER/REPO". That is not just the *wrong* name for
# local use, it makes bootBuildImage fail outright: Docker image repository
# path segments must be lowercase, and "OWNER/REPO" is not (CNB rejects it
# with an "invalid reference format" error before it gets anywhere near the
# `docker images` glob above). Set GITHUB_REPOSITORY yourself, as above, to
# any valid lowercase "owner/repo" — it only has to be well-formed for this
# local, throwaway tag; it does not need to match the real GHCR path this
# repo publishes to (see README.md, which uses jacob-sabella/sockbowl-*).
services:
  sockbowl-game:
    image: sockbowl-game:local

  sockbowl-questions:
    image: sockbowl-questions:local

  sockbowl-ng:
    build:
      context: ../sockbowl-ng
    image: sockbowl-ng:local
