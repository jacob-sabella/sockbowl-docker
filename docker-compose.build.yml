# Local-image overlay.
#
# The "full" profile defaults to the published GHCR `:main` images. Layer this
# file on top of docker-compose.yml (plus docker-compose.dev.yml for e2e) to
# run against locally built code instead, e.g. for the full-stack smoke test
# and Playwright e2e in plans/m2-auth.md section 4.2.
#
#   docker compose -p sockbowl-e2e -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.build.yml --profile full up -d --build
#
# sockbowl-ng ships a real Dockerfile, so Compose can build it directly here.
# sockbowl-game and sockbowl-questions are Spring Boot apps built as OCI
# images by Cloud Native Buildpacks (`./gradlew bootBuildImage`), which have
# no Dockerfile for Compose's `build:` to point at. Build those two the same
# way CI does, then tag the result for this overlay to pick up:
#
#   (cd ../sockbowl-game && ./gradlew bootBuildImage \
#     -I <mavenlocal-init>.gradle -PsockbowlUseMavenLocal=true)
#   docker tag "$(docker images -q ghcr.io/*/sockbowl-game* | head -1)" sockbowl-game:local
#
#   (cd ../sockbowl-questions && ./gradlew bootBuildImage)
#   docker tag "$(docker images -q ghcr.io/*/sockbowl-questions* | head -1)" sockbowl-questions:local
#
# (bootBuildImage's imageName defaults to ghcr.io/${GITHUB_REPOSITORY}:${version};
# with GITHUB_REPOSITORY unset locally that's ghcr.io/OWNER/REPO:<version> —
# `docker images` with a glob finds whatever it produced.)
services:
  sockbowl-game:
    image: sockbowl-game:local

  sockbowl-questions:
    image: sockbowl-questions:local

  sockbowl-ng:
    build:
      context: ../sockbowl-ng
    image: sockbowl-ng:local
