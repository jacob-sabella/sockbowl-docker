# Addresses (M7, plans/m7-deploy.md §3.2): "public" and "internal" are
# separate variables so the same file serves host-network dev and the bridge-
# network prod overlay (docker-compose.prod.yml):
#   SOCKBOWL_PUBLIC_URL      the browser-facing origin (default
#                            ${APP_PROTOCOL}://${APP_HOST}); drives Keycloak
#                            client redirect URIs/web origins (rbac-init).
#   SOCKBOWL_INTERNAL_HOST   where containers reach Kafka, Redis, Postgres and
#                            Neo4j (default ${APP_HOST}).
#   KEYCLOAK_INTERNAL_URL    where containers reach Keycloak for the admin API,
#                            JWKS and client-credentials tokens (default
#                            http://${APP_HOST}:${KEYCLOAK_PORT}).
#   KAFKA_ADVERTISED_HOST    what Kafka advertises to clients (default localhost).
# Every default equals the pre-M7 value, so host-network dev renders the same.
#
# Memory (DK-1): every service has `mem_limit: ${SOCKBOWL_<SERVICE>_MEM_LIMIT:-0}`.
# 0 (the default) means unlimited, which renders as no limit at all, so dev is
# unchanged. The shared 7.6 GiB prod VPS sets real ceilings; see the "Memory
# limits (DK-1)" section of .env.example for the numbers and the JVM caps that
# must go with them.
services:
  kafka:
    image: apache/kafka:4.3.1
    network_mode: "host"
    restart: unless-stopped
    mem_limit: ${SOCKBOWL_KAFKA_MEM_LIMIT:-0}
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      # 7 days: game-session messages must survive consumer lag / replay.
      # The prior 1h value silently dropped messages on any slowdown.
      - KAFKA_LOG_RETENTION_HOURS=168
      # DK-1: bare passthrough (absent unless set). The image's default heap is
      # -Xmx1G, which does not fit a small mem_limit; prod sets e.g.
      # "-Xms384m -Xmx384m" alongside SOCKBOWL_KAFKA_MEM_LIMIT=640m.
      - KAFKA_HEAP_OPTS
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    # NOTE: Postgres major upgrades cannot read an older major's data dir (PG17
    # cannot read PG13, PG18 cannot read PG17, etc). On upgrade from an older
    # stack, remove the old volume first: `docker compose down && docker volume rm sockbowl-docker_postgres_data`
    #
    # NOTE: the postgres:18+ image changed its expected mount point. PGDATA now
    # defaults to a major-version-specific subdirectory (/var/lib/postgresql/18/docker)
    # so pg_upgrade --link works across a future major bump, and the image refuses to
    # start (even against a brand-new empty volume) if you mount straight onto the old
    # /var/lib/postgresql/data path — mount the volume at /var/lib/postgresql instead.
    image: postgres:18
    network_mode: "host"
    restart: unless-stopped
    mem_limit: ${SOCKBOWL_POSTGRES_MEM_LIMIT:-0}
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=sockbowl
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-sockbowl}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak-realm-init:
    image: alpine:3.24.2
    network_mode: "host"
    environment:
      - APP_HOST=${APP_HOST}
      - APP_PROTOCOL=${APP_PROTOCOL}
      - SOCKBOWL_GAME_PORT=${SOCKBOWL_GAME_PORT}
      - SOCKBOWL_PUBLIC_URL=${SOCKBOWL_PUBLIC_URL:-${APP_PROTOCOL}://${APP_HOST}}
      - KEYCLOAK_USER_USERNAME=${KEYCLOAK_USER_USERNAME}
      - KEYCLOAK_USER_EMAIL=${KEYCLOAK_USER_EMAIL}
      - KEYCLOAK_USER_FIRSTNAME=${KEYCLOAK_USER_FIRSTNAME}
      - KEYCLOAK_USER_LASTNAME=${KEYCLOAK_USER_LASTNAME}
      - KEYCLOAK_USER_PASSWORD=${KEYCLOAK_USER_PASSWORD}
      # Demo users are no longer created here (scripts/load-rbac.sh /
      # rbac-init owns CREATE_DEMO_ACCOUNTS now, reconciling `demoUsers` from
      # keycloak/rbac-model.json).
      # check-secrets.sh gate (production refuses placeholder secrets):
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SOCKBOWL_GAME_BACKEND_SECRET=${SOCKBOWL_GAME_BACKEND_SECRET}
      - ALLOW_INSECURE_DEFAULTS=${ALLOW_INSECURE_DEFAULTS:-false}
    volumes:
      - ./scripts/init-keycloak-realm.sh:/init-keycloak-realm.sh
      - ./scripts/check-secrets.sh:/check-secrets.sh:ro
      - ./keycloak/realm-export.template.json:/tmp/realm-export.template.json
      - keycloak_import:/opt/keycloak/data/import
    entrypoint: ["/bin/sh", "/init-keycloak-realm.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    network_mode: "host"
    restart: unless-stopped
    # DK-1: the image already caps the heap at 70% of the container limit
    # (-XX:MaxRAMPercentage=70), so a mem_limit alone is enough here.
    mem_limit: ${SOCKBOWL_KEYCLOAK_MEM_LIMIT:-0}
    environment:
      # KC 26 renamed the bootstrap admin vars; keep legacy ones for back-compat.
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}:${POSTGRES_PORT}/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      # Production-capable default: `start` (not `start-dev`), strict hostname
      # validation against the public URL, and HTTP served behind a
      # forwarded-headers-aware proxy. docker-compose.dev.yml overrides
      # `command` to `start-dev` and relaxes KC_HOSTNAME_STRICT for local/e2e
      # use, where there is no reverse proxy in front of Keycloak.
      - KC_HOSTNAME=${KEYCLOAK_PUBLIC_URL}
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=${KEYCLOAK_PORT}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=true
      - KC_HEALTH_ENABLED=true
    command: start --import-realm
    volumes:
      - keycloak_import:/opt/keycloak/data/import
      # Sockbowl-branded login theme (referenced by realm loginTheme=sockbowl).
      # start-dev disables theme caching, so edits show on the next page load.
      - ./keycloak/themes/sockbowl:/opt/keycloak/themes/sockbowl:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm-init:
        condition: service_completed_successfully
    healthcheck:
      # KC 26's health endpoint lives on the management port (9000), not KC_HTTP_PORT.
      # The image is UBI-based (has bash) but lacks curl/wget, so we speak raw HTTP
      # over a /dev/tcp bash socket instead of shelling out to a client.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  rbac-init:
    image: alpine:3.24.2
    network_mode: "host"
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_INTERNAL_URL:-http://${APP_HOST}:${KEYCLOAK_PORT}}
      - KEYCLOAK_REALM=sockbowl
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - SOCKBOWL_GAME_BACKEND_SECRET=${SOCKBOWL_GAME_BACKEND_SECRET}
      - RBAC_MODEL=/rbac-model.json
      # Client/demo-user reconciliation (section 2.10). CREATE_DEMO_ACCOUNTS
      # defaults to false (prod); docker-compose.dev.yml turns it on along
      # with SOCKBOWL_E2E and ALLOW_INSECURE_DEFAULTS.
      - CREATE_DEMO_ACCOUNTS=${CREATE_DEMO_ACCOUNTS:-false}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
      - SOCKBOWL_E2E=${SOCKBOWL_E2E:-false}
      - SOCKBOWL_AUTH_AUDIENCE=${SOCKBOWL_AUTH_AUDIENCE:-sockbowl-api}
      - KC_ACCESS_TOKEN_LIFESPAN=${KC_ACCESS_TOKEN_LIFESPAN:-300}
      - ALLOW_INSECURE_DEFAULTS=${ALLOW_INSECURE_DEFAULTS:-false}
      - APP_HOST=${APP_HOST}
      - APP_PROTOCOL=${APP_PROTOCOL}
      - SOCKBOWL_GAME_PORT=${SOCKBOWL_GAME_PORT}
      # sockbowl-game's redirectUris/webOrigins/post-logout URIs are exactly
      # ${SOCKBOWL_PUBLIC_URL}/* plus each space-separated origin in
      # SOCKBOWL_EXTRA_REDIRECT_ORIGINS (empty here; docker-compose.dev.yml
      # adds the :4200 and game-port dev origins). load-rbac.sh removes
      # anything else it finds on the client.
      - SOCKBOWL_PUBLIC_URL=${SOCKBOWL_PUBLIC_URL:-${APP_PROTOCOL}://${APP_HOST}}
      - SOCKBOWL_EXTRA_REDIRECT_ORIGINS=${SOCKBOWL_EXTRA_REDIRECT_ORIGINS:-}
      # check-secrets.sh gate also needs these two (not otherwise used above).
      - KEYCLOAK_USER_PASSWORD=${KEYCLOAK_USER_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/load-rbac.sh:/load-rbac.sh
      - ./scripts/check-secrets.sh:/check-secrets.sh:ro
      - ./keycloak/rbac-model.json:/rbac-model.json
      - ./keycloak/clients:/keycloak-clients:ro
      - ./keycloak/realm-settings.json:/realm-settings.json:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache bash curl jq gettext >/dev/null && bash /load-rbac.sh"]
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  neo4j-plugin-init:
    image: curlimages/curl:8.22.0
    network_mode: "host"
    user: "root"
    volumes:
      - ./scripts/download-neo4j-plugins.sh:/plugin.sh
      - neo4j_plugins:/plugins
    entrypoint: ["/plugin.sh"]
    restart: "no"

  redis:
    # Redis Open Source 8 bundles Search/JSON (and Bloom/TimeSeries) as built-in
    # capabilities, replacing the separate redis-stack-server image; no manual
    # --loadmodule flags are needed. 8.10.2 is the newest 8.x tag on Docker Hub
    # (ahead of 8.8.3/8.6.7/8.2.10). Verified against a throwaway container
    # (docker run redis:8.10.2): FT._LIST, JSON.SET/GET and FT.CREATE ... ON JSON
    # all work, and sockbowl-game's Redis OM Spring 2.x repositories start up and
    # index against it unchanged (see a throwaway -p sbm1x full-profile run).
    #
    # DK-3 (M7): Redis requires a password. scripts/redis-start.sh refuses to
    # start without SOCKBOWL_REDIS_PASSWORD (or with a CHANGE_ME placeholder,
    # via check-secrets.sh), writes it into a root-only config file (never onto
    # the command line), and hands over to the image's own entrypoint, which
    # still drops privileges and loads the bundled modules. On this host-network
    # file it binds loopback only (SOCKBOWL_REDIS_BIND), which is the host-
    # network equivalent of "no published port"; the prod overlay moves Redis
    # onto its private bridge network with no ports: at all.
    # REDISCLI_AUTH lets the healthcheck and `docker compose exec redis
    # redis-cli` authenticate without putting the password in argv.
    image: redis:8.10.2
    network_mode: "host"
    restart: unless-stopped
    mem_limit: ${SOCKBOWL_REDIS_MEM_LIMIT:-0}
    environment:
      - SOCKBOWL_REDIS_PASSWORD=${SOCKBOWL_REDIS_PASSWORD:-}
      - REDISCLI_AUTH=${SOCKBOWL_REDIS_PASSWORD:-}
      - SOCKBOWL_REDIS_BIND=${SOCKBOWL_REDIS_BIND:-127.0.0.1 -::1}
      # DK-1: 0 = no maxmemory (dev). The policy is noeviction on purpose: an
      # evicting policy could silently drop ban keys or live game sessions;
      # noeviction makes writes fail instead, which the limiters fail open on (D12).
      - SOCKBOWL_REDIS_MAXMEMORY=${SOCKBOWL_REDIS_MAXMEMORY:-0}
      - ALLOW_INSECURE_DEFAULTS=${ALLOW_INSECURE_DEFAULTS:-false}
    entrypoint: ["/bin/sh", "/redis-start.sh"]
    volumes:
      - redis_data:/data
      - ./scripts/redis-start.sh:/redis-start.sh:ro
      - ./scripts/check-secrets.sh:/check-secrets.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    # CalVer line, matched to the apoc/GDS jars scripts/download-neo4j-plugins.sh
    # fetches. Verified in a throwaway container (neo4j:2026.09 + apoc-2026.09.0 +
    # GDS 2026.09.0): apoc.import.graphml and the questions vector index both work.
    image: neo4j:2026.09
    network_mode: "host"
    restart: unless-stopped
    mem_limit: ${SOCKBOWL_NEO4J_MEM_LIMIT:-0}
    depends_on:
      neo4j-plugin-init:
        condition: service_completed_successfully
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      # DK-1: bare passthroughs (absent unless set). Neo4j sizes heap and page
      # cache from host RAM, not the container limit, so a mem_limit without
      # these gets OOM-killed; prod sets 512m / 384m under a 1100m limit.
      - NEO4J_server_memory_heap_initial__size
      - NEO4J_server_memory_heap_max__size
      - NEO4J_server_memory_pagecache_size
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    command: ["neo4j"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:${NEO4J_PORT:-7687} -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  neo4j-data-import:
    image: neo4j:2026.09
    network_mode: "host"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_HOST=${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}
      - NEO4J_PORT=${NEO4J_PORT}
    volumes:
      - ./scripts/init-neo4j.sh:/init.sh
    entrypoint: ["/init.sh"]
    restart: "no"

  sockbowl-game:
    image: ${SOCKBOWL_GAME_IMAGE:-ghcr.io/jacob-sabella/sockbowl-game:main}
    # App services are gated behind the "full" profile so a bare `docker compose up`
    # starts infra only (run game/questions/ng from source for local dev).
    profiles: ["full"]
    network_mode: "host"
    restart: unless-stopped
    mem_limit: ${SOCKBOWL_GAME_MEM_LIMIT:-0}
    labels:
      # container_name is gone (throwaway `-p` projects need to coexist), so
      # watchtower can no longer target this container by a fixed name; it now
      # watches by this label instead (WATCHTOWER_LABEL_ENABLE=true below).
      #
      # com.centurylinklabs.watchtower.scope pairs with each project's own
      # watchtower's WATCHTOWER_SCOPE (set to ${COMPOSE_PROJECT_NAME} below),
      # so one host running several `-p` projects doesn't have every
      # project's watchtower update every other project's labelled containers.
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=${COMPOSE_PROJECT_NAME}
    environment:
      SOCKBOWL_DATABASE: 0
      SOCKBOWL_KAFKA_BOOTSTRAP_SERVERS: "${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}:${KAFKA_PORT}"
      SOCKBOWL_KAFKA_GAME_TOPIC: "${SOCKBOWL_KAFKA_GAME_TOPIC}"
      SOCKBOWL_PORT: "${SOCKBOWL_GAME_PORT}"
      SOCKBOWL_REDIS_HOST: "${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}"
      SOCKBOWL_REDIS_PORT: "${REDIS_PORT}"
      # DK-3: the same password the redis service requires (Redis OM, the
      # limiter client and the ban mirror all authenticate with it).
      SOCKBOWL_REDIS_PASSWORD: "${SOCKBOWL_REDIS_PASSWORD:-}"
      SOCKBOWL_DB_URL: "jdbc:postgresql://${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}:${POSTGRES_PORT}/sockbowl_users"
      SOCKBOWL_DB_USERNAME: "${POSTGRES_USER}"
      SOCKBOWL_DB_PASSWORD: "${POSTGRES_PASSWORD}"
      SOCKBOWL_QUESTIONS_URL: "${SOCKBOWL_QUESTIONS_INTERNAL_URL:-${APP_PROTOCOL}://${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}:${SOCKBOWL_QUESTIONS_PORT}/}"
      SOCKBOWL_GAME_ALLOWED_ORIGINS: "${SOCKBOWL_GAME_ALLOWED_ORIGINS}"
      # Compose is production-capable by default now (D9), so this falls back
      # to true; AUTH_ENABLED=false stays the supported local-dev opt-out.
      SOCKBOWL_AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      SOCKBOWL_AUTH_AUDIENCE: "${SOCKBOWL_AUTH_AUDIENCE:-sockbowl-api}"
      # The issuer is always the PUBLIC one (it must equal the tokens' iss),
      # while JWKS and the client-credentials token endpoint are fetched over
      # the internal address (M7 §3.5: KC keeps iss public on the back channel).
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_ISSUER_URI}"
      KEYCLOAK_JWK_SET_URI: "${KEYCLOAK_INTERNAL_URL:-http://${APP_HOST}:${KEYCLOAK_PORT}}/realms/sockbowl/protocol/openid-connect/certs"
      KEYCLOAK_TOKEN_URI: "${KEYCLOAK_INTERNAL_URL:-http://${APP_HOST}:${KEYCLOAK_PORT}}/realms/sockbowl/protocol/openid-connect/token"
      # Client-credentials secret for the sockbowl-game-backend service account,
      # used to authenticate game's server-to-server packet fetch to questions.
      SOCKBOWL_GAME_BACKEND_SECRET: "${SOCKBOWL_GAME_BACKEND_SECRET}"
      # M4 rate limiting / quotas. Every key below is a bare passthrough (no
      # value here): left unset in .env, it is genuinely absent from the
      # container's environment (docker compose resolves an unset bare key to
      # null and drops it), so the app's own built-in default in
      # application.properties applies untouched. Set it in .env or an overlay
      # (docker-compose.dev.yml, docker-compose.limits-e2e.yml) to override —
      # see README.md "Limits and quotas". (Deliberately not
      # `${VAR:-}`-substituted: that form always injects the variable, even as
      # an empty string when unset, which breaks Spring's numeric/duration
      # property binding instead of falling through to its default.)
      SOCKBOWL_RATELIMIT_ENABLED:
      SOCKBOWL_QUOTA_ENABLED:
      SOCKBOWL_FORWARD_HEADERS_STRATEGY:
      # The trusted-proxy regex (server.tomcat.remoteip.internal-proxies).
      # SOCKBOWL_INTERNAL_PROXIES is the M7 name; SOCKBOWL_TRUSTED_PROXIES_REGEX
      # is the M4 name, kept as a fallback. Set only one of them.
      SOCKBOWL_INTERNAL_PROXIES:
      SOCKBOWL_TRUSTED_PROXIES_REGEX:
      # Which header carries the real client IP once SOCKBOWL_FORWARD_HEADERS_STRATEGY=native
      # is trusted (see .env.example's "Client IP" note, next to
      # SOCKBOWL_TRUSTED_PROXIES_REGEX). Left unset, the app's own built-in
      # default (x-forwarded-for) applies.
      SOCKBOWL_REMOTE_IP_HEADER:
      SOCKBOWL_RL_SERVICE_CLIENTS:
      SOCKBOWL_RL_DEFAULT_CAPACITY:
      SOCKBOWL_RL_DEFAULT_REFILL_PERIOD:
      SOCKBOWL_RL_SESSION_CREATE_CAPACITY:
      SOCKBOWL_RL_SESSION_CREATE_REFILL_PERIOD:
      SOCKBOWL_RL_SESSION_JOIN_CAPACITY:
      SOCKBOWL_RL_SESSION_JOIN_REFILL_PERIOD:
      SOCKBOWL_RL_WS_CONNECT_CAPACITY:
      SOCKBOWL_RL_WS_CONNECT_REFILL_PERIOD:
      SOCKBOWL_RL_STOMP_SEND_IP_CAPACITY:
      SOCKBOWL_RL_STOMP_SEND_IP_REFILL_PERIOD:
      SOCKBOWL_RL_STOMP_BUZZ_CAPACITY:
      SOCKBOWL_RL_STOMP_BUZZ_REFILL_PERIOD:
      SOCKBOWL_QUOTA_GUEST_HOSTED_SESSIONS:
      SOCKBOWL_QUOTA_PLAYER_HOSTED_SESSIONS:
      SOCKBOWL_QUOTA_AUTHOR_HOSTED_SESSIONS:
      SOCKBOWL_QUOTA_MODERATOR_HOSTED_SESSIONS:
      # DK-1 JVM caps. The buildpack's memory calculator sizes the heap from
      # the container limit (mem_limit above) minus thread stacks, metaspace
      # and code cache; BPL_JVM_THREAD_COUNT (default 250) is the biggest lever
      # under a small limit. JAVA_TOOL_OPTIONS is per service so a developer's
      # own shell value never leaks in. All absent/empty unless set.
      # MaxDirectMemorySize is always set: left alone, the calculator pins it
      # at 10M, and Netty (Lettuce, Kafka, the HTTP client) exhausts that
      # under sustained load (M5 V1: OutOfDirectMemoryError after ~1.5 h of
      # e2e). An explicit flag here is honored by the calculator.
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=${SOCKBOWL_GAME_MAX_DIRECT_MEMORY:-64m} ${SOCKBOWL_GAME_JAVA_TOOL_OPTIONS:-}"
      BPL_JVM_THREAD_COUNT: ${SOCKBOWL_GAME_JVM_THREAD_COUNT:-250}
    volumes:
      # See scripts/healthcheck/README.md: this image has no shell/curl, so the
      # healthcheck below execs the bundled JRE directly against this class.
      - ./scripts/healthcheck:/health:ro
    healthcheck:
      test: ["CMD", "/layers/paketo-buildpacks_bellsoft-liberica/jre/bin/java", "-cp", "/health", "HealthCheck", "http://localhost:${SOCKBOWL_GAME_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      sockbowl-questions:
        condition: service_healthy
      keycloak:
        condition: service_started
      rbac-init:
        condition: service_completed_successfully

  sockbowl-questions:
    image: ${SOCKBOWL_QUESTIONS_IMAGE:-ghcr.io/jacob-sabella/sockbowl-questions:main}
    profiles: ["full"]
    network_mode: "host"
    restart: unless-stopped
    mem_limit: ${SOCKBOWL_QUESTIONS_MEM_LIMIT:-0}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=${COMPOSE_PROJECT_NAME}
    environment:
      SOCKBOWL_NEO4J_USER: "${NEO4J_USER}"
      SOCKBOWL_NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      SOCKBOWL_NEO4J_URL: "bolt://${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}:${NEO4J_PORT}"
      SOCKBOWL_PORT: "${SOCKBOWL_QUESTIONS_PORT}"
      # M4: questions shares game's Redis (same host/port/DB index) for rate
      # limiting, quotas and the ban mirror. Hardcoded to match sockbowl-game's
      # SOCKBOWL_REDIS_HOST/PORT/SOCKBOWL_DATABASE above exactly, rather than
      # exposed as independently overridable env vars, because the two
      # services' limiter/ban keys collide by design (shared `rl:`/`usage:`/
      # `ban:` prefixes) and must land in the same Redis DB — see
      # docs/limits.md "Why questions depends on redis" and its Redis key schema.
      SOCKBOWL_REDIS_HOST: "${SOCKBOWL_INTERNAL_HOST:-${APP_HOST}}"
      SOCKBOWL_REDIS_PORT: "${REDIS_PORT}"
      SOCKBOWL_DATABASE: 0
      # DK-3: the same password as sockbowl-game's (one shared Redis).
      SOCKBOWL_REDIS_PASSWORD: "${SOCKBOWL_REDIS_PASSWORD:-}"
      SOCKBOWL_AI_PROVIDER: "${SOCKBOWL_AI_PROVIDER}"
      SOCKBOWL_AI_LOCAL_MODEL: "${SOCKBOWL_AI_LOCAL_MODEL}"
      SPRING_AI_OPENAI_CHAT_ENABLED: "${SPRING_AI_OPENAI_CHAT_ENABLED}"
      SPRING_AI_OLLAMA_CHAT_ENABLED: "${SPRING_AI_OLLAMA_CHAT_ENABLED}"
      SPRING_AI_OLLAMA_BASE_URL: "${SPRING_AI_OLLAMA_BASE_URL}"
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: "${SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SOCKBOWL_ALLOWED_ORIGINS: "${SOCKBOWL_QUESTIONS_ALLOWED_ORIGINS}"
      # Without these, questions falls back to NoSecurityConfig (permitAll) even
      # when AUTH_ENABLED=true — silently disabling all @PreAuthorize checks.
      # Compose is production-capable by default now (D9), so this falls back
      # to true; AUTH_ENABLED=false stays the supported local-dev opt-out.
      SOCKBOWL_AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      SOCKBOWL_AUTH_AUDIENCE: "${SOCKBOWL_AUTH_AUDIENCE:-sockbowl-api}"
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_ISSUER_URI}"
      # JWKS over the internal address; see the matching comment on sockbowl-game.
      KEYCLOAK_JWK_SET_URI: "${KEYCLOAK_INTERNAL_URL:-http://${APP_HOST}:${KEYCLOAK_PORT}}/realms/sockbowl/protocol/openid-connect/certs"
      # M4 rate limiting / quotas. See the matching comment on sockbowl-game
      # above: every key below is a bare, unset-by-default passthrough.
      SOCKBOWL_RATELIMIT_ENABLED:
      SOCKBOWL_QUOTA_ENABLED:
      SOCKBOWL_FORWARD_HEADERS_STRATEGY:
      # See the matching comments on sockbowl-game above.
      SOCKBOWL_INTERNAL_PROXIES:
      SOCKBOWL_TRUSTED_PROXIES_REGEX:
      SOCKBOWL_REMOTE_IP_HEADER:
      SOCKBOWL_RL_SERVICE_CLIENTS:
      SOCKBOWL_RL_DEFAULT_CAPACITY:
      SOCKBOWL_RL_DEFAULT_REFILL_PERIOD:
      SOCKBOWL_RL_GRAPHQL_READ_CAPACITY:
      SOCKBOWL_RL_GRAPHQL_READ_REFILL_PERIOD:
      SOCKBOWL_RL_GRAPHQL_WRITE_CAPACITY:
      SOCKBOWL_RL_GRAPHQL_WRITE_REFILL_PERIOD:
      SOCKBOWL_RL_AI_GENERATE_CAPACITY:
      SOCKBOWL_RL_AI_GENERATE_REFILL_PERIOD:
      SOCKBOWL_RL_IMPORT_CAPACITY:
      SOCKBOWL_RL_IMPORT_REFILL_PERIOD:
      SOCKBOWL_AI_SERVER_DAILY_BUDGET:
      SOCKBOWL_AI_SERVER_ALLOWED_MODELS:
      # DK-1 JVM caps; see the matching comment on sockbowl-game above.
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=${SOCKBOWL_QUESTIONS_MAX_DIRECT_MEMORY:-64m} ${SOCKBOWL_QUESTIONS_JAVA_TOOL_OPTIONS:-}"
      BPL_JVM_THREAD_COUNT: ${SOCKBOWL_QUESTIONS_JVM_THREAD_COUNT:-250}
    volumes:
      # See scripts/healthcheck/README.md: this image has no shell/curl, so the
      # healthcheck below execs the bundled JRE directly against this class.
      - ./scripts/healthcheck:/health:ro
    healthcheck:
      test: ["CMD", "/layers/paketo-buildpacks_bellsoft-liberica/jre/bin/java", "-cp", "/health", "HealthCheck", "http://localhost:${SOCKBOWL_QUESTIONS_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-data-import:
        condition: service_completed_successfully
      rbac-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  sockbowl-ng:
    image: ${SOCKBOWL_NG_IMAGE:-ghcr.io/jacob-sabella/sockbowl-ng:main}
    profiles: ["full"]
    network_mode: "host"
    restart: unless-stopped
    mem_limit: ${SOCKBOWL_NG_MEM_LIMIT:-0}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=${COMPOSE_PROJECT_NAME}
    environment:
      - APP_HOST=${APP_HOST}
      - APP_PROTOCOL=${APP_PROTOCOL}
      - WS_PROTOCOL=${WS_PROTOCOL}
      - SOCKBOWL_GAME_PORT=${SOCKBOWL_GAME_PORT}
      - SOCKBOWL_QUESTIONS_PORT=${SOCKBOWL_QUESTIONS_PORT}
      - KEYCLOAK_PORT=${KEYCLOAK_PORT}
      # Bare passthrough on purpose (absent unless set): sockbowl-ng switches
      # to single-host path mode (/api, /ws, /questions, /auth) only when
      # SOCKBOWL_PUBLIC_URL is present, so it must NOT get the
      # ${APP_PROTOCOL}://${APP_HOST} default the Keycloak init services use;
      # otherwise port-mode dev would silently flip to path mode.
      - SOCKBOWL_PUBLIC_URL
      # Compose is production-capable by default now (D9), so this falls back
      # to true; AUTH_ENABLED=false stays the supported local-dev opt-out.
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      # nginx CSP connect-src (WP-N4 renders it from this at container start).
      - CSP_EXTRA_CONNECT_SRC=${CSP_EXTRA_CONNECT_SRC:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      sockbowl-game:
        condition: service_healthy
      sockbowl-questions:
        condition: service_healthy

  watchtower:
    # containrrr/watchtower is archived upstream (no more releases/security
    # fixes). nickfedor/watchtower (https://github.com/nicholas-fedor/watchtower)
    # is the actively maintained fork and a drop-in replacement; not switched
    # yet since it hasn't been smoke-tested against this compose file, but
    # it's the first thing to try if this image falls behind or a CVE lands.
    #
    # M6: moved out of the "full" profile into its own opt-in "autoupdate"
    # profile (see README's "Watchtower / Docker socket" section for how to
    # enable it) precisely because it's unmaintained upstream — auto-pulling
    # and restarting containers from an abandoned auto-updater by default is
    # a worse default than requiring an explicit opt-in. `--profile full` no
    # longer starts it; add `--profile autoupdate` (it can be combined with
    # `--profile full`) to also bring it up.
    image: containrrr/watchtower:1.7.1
    profiles: ["autoupdate"]
    volumes:
      # Rootful Docker (most hosts) uses /var/run/docker.sock; rootless Docker
      # uses ${XDG_RUNTIME_DIR}/docker.sock. Override DOCKER_SOCKET_PATH in .env
      # for a rootless host — see README's "Watchtower / Docker socket" section.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=30
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_DEBUG=true
      - DOCKER_API_VERSION=1.44
      # Container names are no longer fixed (container_name was removed so throwaway
      # `-p` projects can coexist), so watch by label instead of by name.
      - WATCHTOWER_LABEL_ENABLE=true
      # Scope this watchtower to only its own project's labelled containers.
      # Without this, every project's watchtower on a host running several
      # `-p` projects at once (e.g. throwaway sbm1x* trials alongside the
      # baseline stack) would watch and update every other project's
      # containers too, since WATCHTOWER_LABEL_ENABLE alone isn't project-scoped.
      - WATCHTOWER_SCOPE=${COMPOSE_PROJECT_NAME}
    restart: unless-stopped

volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_plugins:
    driver: local
  keycloak_import:
    driver: local
